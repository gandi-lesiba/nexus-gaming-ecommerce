<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Nexus Gaming</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<header class="neon-header">
  <div class="container">
    <div class="logo-container">
      <a href="index.html">
        <img src="assets/images/logos/logoo.png" alt="Nexus Logo" class="top-logo" />
      </a>
    </div>
    <div class="cart-icon-container">
      <a href="cart.html" class="cart-link">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-counter">0</span>
      </a>
    </div>
  </div>
</header>

    <main>
        <section class="contact-hero">
            <h1>CONTACT US</h1>
            <p>Have questions? We're here to help!</p>
        </section>
        
        <div class="contact-container">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject">
                        <option value="general">General Enquiry</option>
                        <option value="order">Order Support</option>
                        <option value="technical">Technical Support</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">SEND MESSAGE</button>
            </form>
            
            <div class="contact-info">
                <h3>STORE INFORMATION</h3>
                <p><i class="fas fa-map-marker-alt"></i> 123 Stephen Dlamini rd, Durban</p>
                <p><i class="fas fa-phone"></i> 060 443 8684</p>
                <p><i class="fas fa-envelope"></i> support@nexusgaming.com</p>
                
                <div class="social-links">
                    <a href="#" class="social-icon discord"><i class="fab fa-discord"></i></a>
                    <a href="#" class="social-icon twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon youtube"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="neon-footer">
        <div class="footer-content">
            <p>&copy; <span id="current-year"></span> Nexus Gaming. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
    <script>
        // Set current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Form submission
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! We will respond shortly.');
            this.reset();
        });
    </script>
</body>
</html>
